name: Verify Linux Process-Tree Termination

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'verify/**'
  pull_request:

jobs:
  verify-linux-process-tree:
    name: Linux Process-Tree Termination Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run Process-Tree Integration Tests (Timeout & Cancellation Grandchild Cleanup)
        run: npx vitest run tests/core/process-tree.test.ts --reporter=verbose

      - name: Verify No Orphan Node Processes Remain
        run: |
          echo "Checking active node processes on runner..."
          ps aux | grep -v "grep" | grep -E "node|local-ci" || true
