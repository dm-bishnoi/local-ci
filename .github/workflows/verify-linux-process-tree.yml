name: CI and Linux Process-Tree Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'verify/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify-linux-process-tree:
    name: CI and Linux Process-Tree Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run full test suite
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run Process-Tree Integration Tests (Timeout & Cancellation Grandchild Cleanup)
        run: npx vitest run tests/core/process-tree.test.ts --reporter=verbose
